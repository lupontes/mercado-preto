# nginx for the OCI test environment (managed by infra/docker-compose.oci.yml).
# Not to be confused with infra/nginx/nginx.conf, used by docker-compose.prod.yml.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Product photos taken on a phone exceed 1 MB (the nginx default).
    client_max_body_size 20m;

    # Docker's internal DNS. With a variable in proxy_pass, `medusa` is
    # resolved on each request (10s cache), so recreating the backend
    # container with a different IP does not break the API until nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The storefront runs on the host (PM2). `host.docker.internal` comes from
    # extra_hosts (host-gateway) and only exists in the container's /etc/hosts:
    # Docker's DNS cannot resolve it, so this upstream is static (resolved at
    # startup) instead of using a variable like medusa does.
    upstream storefront {
        server host.docker.internal:3000;
    }

    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name teste.mercadopreto.com.br;

        ssl_certificate /etc/nginx/ssl/live/teste.mercadopreto.com.br/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/teste.mercadopreto.com.br/privkey.pem;

        set $medusa_upstream http://medusa:9000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/ strips the prefix. It is the base of BACKEND_URL: Mercado Pago
        # webhooks, /static for uploads and the Mercado Livre callback.
        # With a variable in proxy_pass nginx does not replace the URI on its
        # own, hence the rewrite (the query string is preserved).
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $medusa_upstream;
        }

        location /app/    { proxy_pass $medusa_upstream; }
        location /auth/   { proxy_pass $medusa_upstream; }
        location /admin/  { proxy_pass $medusa_upstream; }
        location /store/  { proxy_pass $medusa_upstream; }
        location /seller/ { proxy_pass $medusa_upstream; }

        location / {
            proxy_pass http://storefront;
        }
    }
}
