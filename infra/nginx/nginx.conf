worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    upstream medusa_api {
        server medusa:9000;
    }

    upstream storefront {
        # O storefront roda como processo PM2 no host (não é containerizado —
        # ver docs/DEPLOY_OCI.md), então é alcançado pelo gateway da rede
        # bridge do Docker, não por nome de container. Havia um container
        # `storefront` órfão (não gerenciado por nenhum compose deste repo,
        # parado havia 3+ dias) pro qual esse upstream apontava até
        # 2026-09-07 — todo o tráfego do domínio real servia uma build
        # desatualizada, sem que nenhum redeploy via PM2 tivesse efeito.
        server 172.18.0.1:3000;
    }

    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        # Root domain (mercadopreto.com.br / www) still points to the old store
        # and is intentionally left out of this config — only the new
        # marketplace's subdomain is served here.
        server_name teste.mercadopreto.com.br;

        ssl_certificate /etc/nginx/ssl/live/teste.mercadopreto.com.br/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/teste.mercadopreto.com.br/privkey.pem;

        location /api/ {
            proxy_pass http://medusa_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Medusa's admin SPA is built with a fixed base path of /app/ and its
        # HTML references asset URLs as absolute /app/assets/... — proxying
        # it under /api/ (which strips the prefix) breaks those asset
        # requests (they fall through to the storefront's location / and
        # 404, leaving the admin panel blank). Forward /app/ to medusa with
        # the prefix preserved so the SPA's own paths resolve correctly.
        location /app/ {
            proxy_pass http://medusa_api/app/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The admin SPA's own API calls (login, every admin/* CRUD request)
        # are also unprefixed — it assumes it's being served from the same
        # origin as the Medusa API root, not from behind /api/. Proxy these
        # two top-level Medusa route namespaces directly so the admin panel
        # can actually authenticate and fetch data, not just load its shell.
        location /auth/ {
            proxy_pass http://medusa_api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://medusa_api/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://storefront;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
