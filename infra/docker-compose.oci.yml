# =============================================================================
# Mercado Preto — Oracle Cloud test environment (Environment B)
# Server: 168.138.148.67 | Public ports: 80, 443 (and 22 for SSH)
#
# Usage:
#   Start:    docker compose -f docker-compose.oci.yml --env-file .env.oci up -d
#   Logs:     docker compose -f docker-compose.oci.yml logs -f
#   Stop:     docker compose -f docker-compose.oci.yml down
#   Rebuild:  docker compose -f docker-compose.oci.yml build --no-cache medusa
#
# Internal ports are published on 127.0.0.1 only (reach them via SSH tunnel).
# =============================================================================

# Pinned on purpose: the project name prefixes the volumes (infra_postgres_data
# etc.). Changing it makes Docker create new, empty volumes. It is also the
# project name of docker-compose.prod.yml, which lives in the same folder.
name: infra

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — banco principal (interno, sem porta externa)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mercado-preto-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — cache e filas (interno, sem porta externa)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mercado-preto-redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Meilisearch — full-text search (internal; dashboard via SSH tunnel to the container's port 7700)
  # ---------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: mercado-preto-search
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: development
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Evolution API — gateway WhatsApp (porta 8080 — NSG aberta)
  # SERVER_URL aponta para o IP público do servidor OCI
  # ---------------------------------------------------------------------------
  evolution-api:
    image: evoapicloud/evolution-api:2.4.0-rc2
    container_name: mercado-preto-evolution
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_URL: http://${SERVER_IP}:8080
      DEL_INSTANCE: "false"
      LANGUAGE: pt-BR
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_TTL: "604800"
      QRCODE_LIMIT: "30"
      QRCODE_COLOR: "#00a884"
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1035194821"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evolution_data:/evolution/instances

  # ---------------------------------------------------------------------------
  # Medusa backend — marketplace engine (public only via nginx at /api, /app, /auth, /admin, /store, /seller)
  # Build: docker build -t mercado-preto-api packages/medusa-backend
  # ---------------------------------------------------------------------------
  medusa:
    build:
      context: ../packages/medusa-backend
      dockerfile: Dockerfile
    image: mercado-preto-api:oci
    container_name: mercado-preto-api
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      # Infra (resolvida dentro da rede Docker)
      # sslmode=disable é obrigatório: sem ele, o driver pg trava
      # indefinidamente (60s+ por tentativa, retry infinito) negociando TLS
      # com um Postgres que não fala SSL — visto em 2026-09-07 travando
      # `medusa db:migrate` por horas sem nenhum erro logado.
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      REDIS_URL: redis://redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY}
      # production é obrigatório: com development o Medusa serve o painel
      # admin (/app) pelo servidor de dev do Vite, que bloqueia qualquer host
      # fora de localhost ("Blocked request ... server.allowedHosts") — visto
      # em 2026-10-12 impedindo o acesso ao painel master via domínio.
      # Sandbox das integrações é controlado por MARKETPLACE_SANDBOX, não aqui.
      NODE_ENV: production

      # Segurança
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}

      # CORS — the browser only talks to the public domain (nginx in front)
      STORE_CORS: ${PUBLIC_URL}
      ADMIN_CORS: ${PUBLIC_URL}
      AUTH_CORS: ${PUBLIC_URL}

      # MercadoPago
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET}

      # Pagamento "Dinheiro (teste)" — só ambientes de teste (ver .env.template)
      TEST_CASH_PAYMENT_ENABLED: ${TEST_CASH_PAYMENT_ENABLED:-false}

      # Public backend URL: base for the Mercado Pago notification_url, the
      # uploads /static and the Mercado Livre callback. nginx strips the /api
      # prefix before the request reaches medusa.
      BACKEND_URL: ${PUBLIC_URL}/api

      # Melhor Envio
      MELHOR_ENVIO_TOKEN: ${MELHOR_ENVIO_TOKEN}
      MELHOR_ENVIO_ORIGIN_CEP: ${MELHOR_ENVIO_ORIGIN_CEP:-44300000}

      # Brevo (e-mail)
      BREVO_API_KEY: ${BREVO_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@mercadopreto.com.br}

      # Evolution API (referenciado pelo nome do container na rede interna)
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_API_INSTANCE: ${EVOLUTION_API_INSTANCE}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET}

      # Focus NFe (fiscal)
      FOCUS_NFE_TOKEN: ${FOCUS_NFE_TOKEN}
      FOCUS_NFE_SANDBOX: ${FOCUS_NFE_SANDBOX:-true}
      FOCUS_NFE_CNPJ: ${FOCUS_NFE_CNPJ}
      FOCUS_NFE_IE: ${FOCUS_NFE_IE}
      FOCUS_NFE_ADDRESS_STREET: ${FOCUS_NFE_ADDRESS_STREET}
      FOCUS_NFE_ADDRESS_NUMBER: ${FOCUS_NFE_ADDRESS_NUMBER}
      FOCUS_NFE_ADDRESS_DISTRICT: ${FOCUS_NFE_ADDRESS_DISTRICT}
      FOCUS_NFE_ADDRESS_CITY: ${FOCUS_NFE_ADDRESS_CITY:-Cachoeira}
      FOCUS_NFE_ADDRESS_STATE: ${FOCUS_NFE_ADDRESS_STATE:-BA}
      FOCUS_NFE_ADDRESS_ZIP: ${FOCUS_NFE_ADDRESS_ZIP:-44300000}

      # ClearSale (anti-fraude)
      CLEARSALE_WEBHOOK_SECRET: ${CLEARSALE_WEBHOOK_SECRET}

      # Comissão padrão
      MARKETPLACE_COMMISSION_RATE: ${MARKETPLACE_COMMISSION_RATE:-15}

    volumes:
      # Arquivos enviados pelo file module local (imagens de produto). Sem
      # este volume, cada recriação do container perde /app/static e todas as
      # imagens passam a dar 404 — visto em 2026-10-15. O nome resolve para
      # o volume existente `infra_backend_uploads`, criado pelo
      # docker-compose.prod.yml (mesmo nome de projeto: `infra`).
      - backend_uploads:/app/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Certbot — automatic Let's Encrypt certificate renewal
  # Writes to ./nginx/certbot, which the nginx service below reads and reloads
  # every 6h; without this service the certificate expires after 90 days with
  # no warning (happened on 2026-10-05). Initial issuance: infra/nginx/init-letsencrypt.sh
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: mercado-preto-certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # nginx — the only public entry point (80/443)
  # OCI-specific config in ./nginx/oci, mounted as a directory: a single file
  # mounted on its own does not see changes from a git pull, because checkout
  # creates a new inode. The storefront runs on the host (PM2) and is reached
  # through host.docker.internal.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: mercado-preto-nginx
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/oci:/etc/nginx/oci:ro
      - ./nginx/certbot/conf:/etc/nginx/ssl:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - medusa
    restart: unless-stopped
    command: sh -c 'while :; do sleep 6h; nginx -c /etc/nginx/oci/nginx.conf -s reload; done & exec nginx -c /etc/nginx/oci/nginx.conf -g "daemon off;"'

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  evolution_data:
  backend_uploads:
